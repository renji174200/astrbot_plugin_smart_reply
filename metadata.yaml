name: astrbot_plugin_smart_reply
display_name: 智能接话
short_desc: 用打分判断机器人该不该接话，替代"全回"或"按概率回"
desc: |
  让机器人自己决定什么时候开口。

  - 打分制：模型给 0~100 分，≥ 阈值才回复，比"回/不回"更可控
  - 刚说过话自动提高门槛，避免连续刷屏
  - 名字 / 引用 / 催促词硬触发，不依赖模型
  - 三级重试 + 备用模型，判断失败自动降级
  - 判断日志 JSONL，可按分数分布调阈值
  - 全部配置项可在 WebUI 面板调整，模型用下拉框选择
version: 2.0.1
author: qqagent-suite
repo: https://github.com/renji174200/astrbot_plugin_smart_reply
astrbot_version: ">=4.25"
support_platforms:
  - aiocqhttp
tags:
  - 群聊
  - 接话
  - 主动回复
  - 判断
